<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Rastreador de Empenhos</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f3f6fa; color: #172033; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { background: white; border: 1px solid #dce3ee; border-radius: 12px; padding: 2rem; width: min(390px, calc(100% - 2rem)); box-shadow: 0 8px 30px #17203312; }
    h1 { font-size: 1.35rem; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #bac7d8; border-radius: 6px; font: inherit; }
    button { margin-top: 1.25rem; width: 100%; padding: .75rem; border: 0; border-radius: 6px; background: #1456a0; color: white; font: inherit; cursor: pointer; }
    .message { color: #9c2525; margin: .5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Gerenciar processos PNCP</h1>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="message">{{ message }}</p>
    {% endfor %}
    <form method="post" action="{{ url_for('authenticate') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
